services:
  app:
    build:
      context: .
    image: kz-tax-report:local
    volumes:
      - ${INPUTS_HOST_DIR:-./data}:/inputs:ro
      - ${OUTPUT_HOST_DIR:-./output}:/outputs
    environment:
      KZ_TAX_REPORT_NBK_DOWNLOAD_URL: ${KZ_TAX_REPORT_NBK_DOWNLOAD_URL:-}
      KZ_TAX_REPORT_IBKR_REPORTS_URL: ${KZ_TAX_REPORT_IBKR_REPORTS_URL:-}
      KZ_TAX_REPORT_FREEDOM_REPORTS_URL: ${KZ_TAX_REPORT_FREEDOM_REPORTS_URL:-}
    working_dir: /app

  web:
    profiles: [web]
    build:
      context: .
    image: kz-tax-report:local
    ports:
      - "${KZ_TAX_REPORT_UI_PORT:-8080}:8080"
    volumes:
      - ${OUTPUT_HOST_DIR:-./output}:/outputs
    environment:
      KZ_TAX_REPORT_UI_HOST: 0.0.0.0
      KZ_TAX_REPORT_UI_PORT: 8080
      KZ_TAX_REPORT_ARTIFACT_MODE: local
      KZ_TAX_REPORT_ARTIFACT_DIR: /tmp/kz-tax-report-jobs
      KZ_TAX_REPORT_OUTPUT_DIR: /outputs
      KZ_TAX_REPORT_NBK_DOWNLOAD_URL: ${KZ_TAX_REPORT_NBK_DOWNLOAD_URL:-}
      KZ_TAX_REPORT_IBKR_REPORTS_URL: ${KZ_TAX_REPORT_IBKR_REPORTS_URL:-}
      KZ_TAX_REPORT_FREEDOM_REPORTS_URL: ${KZ_TAX_REPORT_FREEDOM_REPORTS_URL:-}
    working_dir: /app
    entrypoint: ["/app/.venv/bin/kz-tax-report-ui"]
    command: []
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-hosted:
    profiles: [hosted]
    build:
      context: .
    image: kz-tax-report:local
    ports:
      - "127.0.0.1:${KZ_TAX_REPORT_UI_PORT:-8080}:8080"
    tmpfs:
      - /tmp/kz-tax-report-jobs:mode=700
    environment:
      KZ_TAX_REPORT_UI_HOST: 0.0.0.0
      KZ_TAX_REPORT_UI_PORT: 8080
      KZ_TAX_REPORT_MODE: hosted
      KZ_TAX_REPORT_ARTIFACT_MODE: hosted
      KZ_TAX_REPORT_ARTIFACT_DIR: /tmp/kz-tax-report-jobs
      KZ_TAX_REPORT_ARTIFACT_TTL_SECONDS: ${KZ_TAX_REPORT_ARTIFACT_TTL_SECONDS:-}
      KZ_TAX_REPORT_MAX_UPLOAD_BYTES: ${KZ_TAX_REPORT_MAX_UPLOAD_BYTES:-}
      KZ_TAX_REPORT_MAX_JOB_BYTES: ${KZ_TAX_REPORT_MAX_JOB_BYTES:-}
      KZ_TAX_REPORT_ACCESS_ISSUER: ${KZ_TAX_REPORT_ACCESS_ISSUER:-}
      KZ_TAX_REPORT_ACCESS_AUDIENCE: ${KZ_TAX_REPORT_ACCESS_AUDIENCE:-}
      KZ_TAX_REPORT_ACCESS_JWKS_URL: ${KZ_TAX_REPORT_ACCESS_JWKS_URL:-}
      KZ_TAX_REPORT_SESSION_SECRET: ${KZ_TAX_REPORT_SESSION_SECRET:-}
      KZ_TAX_REPORT_PUBLIC_URL: ${KZ_TAX_REPORT_PUBLIC_URL:-}
      KZ_TAX_REPORT_TRUST_PROXY: ${KZ_TAX_REPORT_TRUST_PROXY:-}
      KZ_TAX_REPORT_NBK_DOWNLOAD_URL: ${KZ_TAX_REPORT_NBK_DOWNLOAD_URL:-}
      KZ_TAX_REPORT_IBKR_REPORTS_URL: ${KZ_TAX_REPORT_IBKR_REPORTS_URL:-}
      KZ_TAX_REPORT_FREEDOM_REPORTS_URL: ${KZ_TAX_REPORT_FREEDOM_REPORTS_URL:-}
      KZ_TAX_REPORT_RULES_DIR: ${KZ_TAX_REPORT_RULES_DIR:-}
    working_dir: /app
    entrypoint: ["/app/.venv/bin/kz-tax-report-ui"]
    command: []
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
