[project]
name = "kz-tax-report"
version = "0.1.0"
description = "Local-first calculator for Kazakhstan investment tax declaration inputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "nicegui>=2.24.0",
    "typer>=0.27.0",
]

[project.scripts]
kz-tax-report = "kz_tax_report.cli:main"
kz-tax-report-ui = "kz_tax_report.web_ui:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
